# Exam-Analysis-Suite 五大数据库服务
# 启动: docker compose -f docker-compose.services.yml up -d
# 停止: docker compose -f docker-compose.services.yml down
# 注意: down 默认不删除 volume，数据保留。如需彻底清理加 -v 参数。

version: "3.9"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: exam-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_analysis       # 自动建库，无需手动 createdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant 向量数据库 ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: exam-qdrant
    ports:
      - "6333:6333"                     # HTTP API（向量读写）
      - "6334:6334"                     # gRPC（本项目未用，预留）
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── OpenSearch 全文检索 ───────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: exam-opensearch
    ports:
      - "9200:9200"                     # REST API
      - "9600:9600"                     # 性能监控（可选）
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # 本项目不启用安全认证
      # 内存限制（根据宿主机配置调整，2.11 默认约 1GB）
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  # ── Neo4j 图数据库 ────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: exam-neo4j
    ports:
      - "7474:7474"                     # 浏览器 UI
      - "7687:7687"                     # Bolt 协议（应用连接）
    environment:
      NEO4J_AUTH: neo4j/exam123456
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # ── Redis（Celery 消息队列）───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - "6380:6379"                     # 宿主机 6380 → 容器内默认 6379
    command: >                          # 开启 AOF 持久化，崩溃可恢复
      redis-server
      --port 6379
      --appendonly yes
      --bind 0.0.0.0
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  osdata:
  neo4j_data:
  neo4j_logs:
  redis_data:
